name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures-and-review:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Credential and data boundary checks
        run: python tools/check_secrets.py --tracked
      - name: Public Git history and author privacy
        run: python tools/check_public_history.py
      - run: python -m pip install -r requirements.txt
      - name: Archive configuration and sample checks
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Offline disclosure pipeline
        run: python news-audit-skill/tests/disclosure_fixture_e2e.py --out "${{ github.workspace }}/ver_1/run_fixture_ci"
      - name: Review workspace
        run: python -m unittest discover -s ver_1/review_ui -p "test_*.py" -v

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 신문산업 점검 작업실</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin-style.css"></head><body class="auth-body"><section class="auth-card"><div class="eyebrow">2026 신문산업 실태점검</div><h1>점검 작업실 로그인</h1><p>관리자는 원본 조사자료와 배정을 관리하고,<br>조사자는 배정된 매체를 확인합니다.</p><form id="login-form"><label class="form-label" for="username">아이디</label><input id="username" autocomplete="username" required><label class="form-label" for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="login-submit">로그인</button></form><p id="login-message" role="alert"></p><small>초기 관리자 정보는 서버의 초기 자격 증명 파일에서 확인하세요.</small></section><script src="/login.js"></script></body></html>
